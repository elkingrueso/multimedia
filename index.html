
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Visor Vertical - App</title>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:auto; -webkit-tap-highlight-color: transparent;}
  body{display:flex;flex-direction:column;align-items:center;font-family:Arial; min-height:100vh; padding-top:10px; padding-bottom:80px; box-sizing:border-box;}

  #pantalla{width:360px;height:270px;background:#111;position:relative;flex-shrink:0; border:1px solid #222;}
  #menu{margin-top:12px;color:#999;font-size:13px;text-align:center;user-select:none;}
  #menu span, #menu a{color:#999;cursor:pointer;padding:0 8px;transition:color.2s; text-decoration:none;}
  #menu span:hover, #menu a:hover{color:#fff}

  /* LISTA DE CAPITULOS */
  #capitulos{margin-top:20px; width:411px; max-width:95vw;}
  #capitulos h3{color:#666; font-size:12px; letter-spacing:2px; text-align:center; margin-bottom:10px;}
 .grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
 .btn-cap{background:#1a1a1a; border:1px solid #333; color:#ccc; padding:12px 5px; border-radius:6px; cursor:pointer; font-size:13px; text-align:center; transition:all.2s;}
 .btn-cap:hover{background:#fff; color:#000; border-color:#fff;}
 .btn-cap.activo{background:#fff; color:#000;}

  /* BANNER ADMOB - Placeholder */
  #admob-banner{position:fixed; bottom:0; left:0; width:100%; height:60px; background:#000; border-top:1px solid #222; display:flex; justify-content:center; align-items:center; color:#333; font-size:11px; z-index:999;}

  #fileInput{display:none}
</style>
</head>
<body>

<div id="pantalla"></div>

<div id="menu">
  <span id="btnSubir">Subir</span> / <a href="https://www.facebook.com/groups/282270374234716/files/files" target="_blank">Acerca</a> / <a href="https://paypal.me/elkingrueso" target="_blank">Donar</a> / <span id="btnFull">Full</span>
</div>

<div id="capitulos">
  <h3>CAPÍTULOS</h3>
  <div class="grid" id="gridCaps">
    <!-- AÑADE TUS CAPITULOS AQUI -->
    <!-- Solo duplica la linea -->
    <div class="btn-cap" onclick="cargarCapitulo(this, 'capitulos/cap1.swf')">Capítulo 1</div>
    <div class="btn-cap" onclick="cargarCapitulo(this, 'capitulos/cap2.swf')">Capítulo 2</div>
    <div class="btn-cap" onclick="cargarCapitulo(this, 'capitulos/cap3.swf')">Capítulo 3</div>
    <div class="btn-cap" onclick="cargarCapitulo(this, 'capitulos/cap4.swf')">Capítulo 4</div>
    <!-- Para añadir el 5, solo pega: <div class="btn-cap" onclick="cargarCapitulo(this, 'capitulos/cap5.swf')">Capítulo 5</div> -->
  </div>
</div>

<!-- ESTE DIV ES DONDE APARECERÁ EL ANUNCIO EN LA APP -->
<div id="admob-banner">ESPACIO PARA BANNER ADMOB 320x50</div>

<input type="file" id="fileInput" accept=".swf">

<script>
const pantalla = document.getElementById('pantalla');
const fileInput = document.getElementById('fileInput');
let player = null;

function crearPlayer(){
  pantalla.innerHTML = "";
  const ruffle = window.RufflePlayer.newest();
  player = ruffle.createPlayer();
  player.style.width = "360px";
  player.style.height = "270px";
  player.style.display = "block";
  pantalla.appendChild(player);
  return player;
}

function cargarSWF(url){
  const p = crearPlayer();
  p.load(url).catch(e => {
    console.error(e);
    alert("No se pudo cargar: " + url);
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

function cargarCapitulo(btn, url){
  document.querySelectorAll('.btn-cap').forEach(b=>b.classList.remove('activo'));
  btn.classList.add('activo');
  cargarSWF(url);
}

// Carga inicial
window.addEventListener('load', () => {
  cargarSWF("capitulos/cap1.swf"); // cambia esto por tu swf principal o deja cap1
});

// BOTONES
document.getElementById('btnSubir').addEventListener('click', () => {
  fileInput.value = ""; fileInput.click();
});
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const blobUrl = URL.createObjectURL(file);
  cargarSWF(blobUrl);
});
document.getElementById('btnFull').addEventListener('click', async () => {
  if(!player) return;
  try{
    if(player.requestFullscreen) await player.requestFullscreen();
    else if(pantalla.requestFullscreen) await pantalla.requestFullscreen();
  }catch(err){}
});
document.addEventListener('fullscreenchange', () => {
  const isFs =!!document.fullscreenElement;
  pantalla.style.width = isFs? "100vw" : "360px";
  pantalla.style.height = isFs? "100vh" : "270px";
  if(player){
    player.style.width = isFs? "100vw" : "360px";
    player.style.height = isFs? "100vh" : "270px";
  }
});
</script>
</body>
</html>
